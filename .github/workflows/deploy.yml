# Intégration et déploiement continus du portfolio
#  - CI : à chaque push et pull request vers main ou preprod, on vérifie que le code est sain
#         (syntaxe, secrets, tests unitaires, compilation React)
#  - CD : quand la CI réussit sur une branche d'environnement, la version est mise en ligne
#         (VPS OVH, utilisateur "deploy") :
#           preprod -> https://preprod.godwindovon.fr (pré-production)
#           main    -> https://mds.godwindovon.fr     (production)
#  Les deux branches sont protégées : on n'y arrive que par une pull request dont la CI est verte.
name: CI/CD

on:
  push:
    branches: [main, preprod]
  pull_request:
    branches: [main, preprod]
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

# Deux déploiements d'un même environnement ne tournent jamais en même temps :
# le plus récent attend la fin du précédent
concurrency:
  group: deploiement-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # CI : vérifications automatiques
  # ---------------------------------------------------------------------------
  ci:
    name: Vérifications (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.3 (même version qu'en production)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl
          coverage: none

      - name: Vérification de la syntaxe PHP
        run: |
          erreurs=0
          for fichier in $(git ls-files '*.php'); do
            php -l "$fichier" > /dev/null || erreurs=$((erreurs + 1))
          done
          echo "$(git ls-files '*.php' | wc -l) fichiers PHP vérifiés, $erreurs erreur(s)"
          test "$erreurs" -eq 0

      - name: Aucun secret commité
        run: |
          echo "Fichiers de configuration réelle (doivent rester sur le serveur uniquement)"
          if git ls-files | grep -E '(^|/)(config\.php|\.env)$'; then
            echo "::error::Un fichier de configuration contenant des secrets est versionné"; exit 1
          fi
          echo "Clés privées"
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::Une clé privée est présente dans le dépôt"; exit 1
          fi
          echo "Mots de passe écrits en clair dans le code PHP"
          if git grep -nE "(->Password|'password'|'secret'|\"password\"|\"secret\")\s*(=|=>)\s*['\"][^'\"]+['\"]" -- '*.php'; then
            echo "::error::Un mot de passe est écrit en clair dans le code"; exit 1
          fi
          echo "Aucun secret détecté"

      - name: Installation des dépendances de test (Composer)
        run: composer install --no-interaction --no-progress --prefer-dist

      # Un seul test en échec fait échouer la CI, et donc bloque le déploiement
      - name: Tests unitaires (PHPUnit)
        run: vendor/bin/phpunit --testdox

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projets/todo-react/app/package-lock.json

      - name: Compilation du projet React (TypeScript + Vite)
        working-directory: projets/todo-react/app
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # CD : mise en ligne, uniquement si la CI a réussi, après un merge sur main ou preprod
  # (jamais pour une pull request encore ouverte)
  # ---------------------------------------------------------------------------
  deploy:
    name: Déploiement en ${{ github.ref_name == 'main' && 'production' || 'pré-production' }} (CD)
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preprod')
    runs-on: ubuntu-latest
    # Environnement GitHub : historique des déploiements et lien vers le site dans l'onglet "Deployments"
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preproduction' }}
      url: ${{ github.ref_name == 'main' && 'https://mds.godwindovon.fr' || 'https://preprod.godwindovon.fr' }}
    env:
      SITE: ${{ github.ref_name == 'main' && 'https://mds.godwindovon.fr' || 'https://preprod.godwindovon.fr' }}
      DOSSIER: ${{ github.ref_name == 'main' && '/srv/portfolio-mds' || '/srv/portfolio-preprod' }}
      SCRIPT: ${{ github.ref_name == 'main' && 'deploy-portfolio-mds' || 'deploy-portfolio-preprod' }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de l'accès SSH au serveur
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Identité du serveur vérifiée : protège contre une attaque de l'homme du milieu
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Envoi de la nouvelle version sur le serveur
        env:
          CIBLE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          # git archive : uniquement les fichiers versionnés (aucun secret, aucune donnée locale)
          git archive --format=tar HEAD \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$CIBLE" \
              "find $DOSSIER/incoming -mindepth 1 -delete && tar -x -C $DOSSIER/incoming && echo \"\$(find $DOSSIER/incoming -type f | wc -l) fichiers reçus dans $DOSSIER\""

      - name: Mise en ligne (script du serveur)
        env:
          CIBLE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$CIBLE" "sudo /usr/local/bin/$SCRIPT"

      - name: Vérification du site en ligne
        run: |
          for page in "" realisations.php contact.php "projets/restaurant/index.php?page=menu" projets/site-vitrine/ projets/calculateur-imc/ projets/todo-javascript/ projets/todo-react/demo/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/$page")
            echo "$code  $SITE/$page"
            test "$code" = "200"
          done

      - name: Suppression de la clé SSH du runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
